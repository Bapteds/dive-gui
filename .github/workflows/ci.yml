name: CI

# Lint, type-check, test, and build the monorepo on every push to main and on
# every pull request. The API tests provision an isolated SQLite database via
# Prisma (the vitest globalSetup runs `prisma db push --force-reset`), so the
# Prisma client must be generated before they run.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (lint, typecheck, test, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w @dive/api

      - name: Build shared contract
        run: npm run build:shared

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Baked into the web bundle; the real value is set per deployment.
          VITE_API_URL: http://localhost:4000/api/v1

  # Real chamber-geometry tests: run buildChamber.py with the actual
  # CadQuery/OCC kernel (pinned in requirements-geometry.txt) and assert
  # watertightness, patch sets, golden volumes, and the overflow policies.
  # A separate job so the ~3 min of real builds never delays verify feedback.
  # Local machines without cadquery skip this suite; CI is the authority.
  geometry:
    name: Geometry (real chamber builder)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the pinned wheels (numpy 2.4 / scipy 1.18 need >= 3.11;
          # the reference dev env is 3.12).
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/scripts/requirements-geometry.txt

      - name: Install geometry environment
        run: pip install -r apps/api/scripts/requirements-geometry.txt

      - name: Run geometry tests
        run: pytest apps/api/scripts/tests -v
