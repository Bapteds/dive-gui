name: CI

# Lint, type-check, test, and build the monorepo on every push to main and on
# every pull request. The API tests provision an isolated SQLite database via
# Prisma (the vitest globalSetup runs `prisma db push --force-reset`), so the
# Prisma client must be generated before they run.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (lint, typecheck, test, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w @dive/api

      - name: Build shared contract
        run: npm run build:shared

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Baked into the web bundle; the real value is set per deployment.
          VITE_API_URL: http://localhost:4000/api/v1
